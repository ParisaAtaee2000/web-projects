name: Zemestan CI

on:
  push:
    paths:
      - 'zemestan/**'
  pull_request:
    paths:
      - 'zemestan/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zemestan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zemestan/package-lock.json
      - run: npm install
      - run: npm run build
