name: NEXORA build

on:
  push:
    paths:
      - 'nexora/**'
      - '.github/workflows/nexora-build.yml'
  pull_request:
    paths:
      - 'nexora/**'
      - '.github/workflows/nexora-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nexora/package-lock.json
      - run: npm ci
      - run: npm run build
